<!doctype html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link
      rel="stylesheet"
      href="https://s4.zstatic.net/ajax/libs/docsify/4.13.1/themes/vue.min.css"
    />
    <link
      rel="stylesheet"
      href="https://registry.npmmirror.com/lxgw-wenkai-screen-web/latest/files/style.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.cbd.int/docsify-plugin-toc@1.3.1/dist/light.css"
    />
    <link
      rel="stylesheet"
      href="https://s4.zstatic.net/ajax/libs/sweetalert/1.1.3/sweetalert.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <nav>
      <a href="#/">🍄主页</a>
      <a href="#/notify">🐣公告</a>
    </nav>
    <div id="app">加载中</div>
    <script>
      window.$docsify = {
        el: "#app",
        homepage: "home.md",
        basePath: "./",
        routerMode: "hash",
        coverpage: false,
        onlyCover: false,
        loadSidebar: true,
        alias: {
          "/.*/_sidebar.md": "/_sidebar.md",
        },
        subMaxLevel: 0,
        topMargin: 25,
        auto2top: true,
        mergeNavbar: false,
        externalLinkTarget: "_blank",
        copyCode: {
          buttonText: "复制到剪贴板",
          errorText: "Error",
          successText: "复制成功",
        },
        count: {
          countable: true,
          fontsize: "0.9em",
          color: "rgb(90,90,90)",
          language: "chinese",
        },
        scrollToTop: {
          auto: true,
          text: "Top",
          right: 12,
          bottom: 52,
          offset: 25,
        },
        footer: {
          copy: '<span id="sitetime"></span><br/><span>Copyright &copy; 2017-2026 &nbsp 💖 &nbsp</span>',
          auth: '<strong><a href="https://myzye.com/" target="_blank">LaoYee</a></strong>',
          pre: "<hr/>",
          style: "font-size: 14px; text-align: center;",
        },
        toc: {
          tocMaxLevel: 5,
          target: "h2, h3, h4",
          ignoreHeaders: [
            "<!-- {docsify-ignore} -->",
            "<!-- {docsify-ignore-all} -->",
          ],
        },
        markdown: {
          renderer: {
            image: function (href, title, text) {
              var image_html = this.origin.image.apply(this, arguments);
              return (
                "<figure>" +
                image_html +
                "<figcaption>" +
                text +
                "</figcaption></figure>"
              );
            },
          },
        },
      };
    </script>
    <!-- cdnjs.cloudflare.com s4.zstatic.net cdnjs.loli.net sf.akass.cn cdnjs.snrat.com mirrors.sustech.edu.cn/cdnjs -->
    <!-- unpkg.com cdn.cbd.int npm.onmicrosoft.cn -->
    <script src="https://s4.zstatic.net/ajax/libs/docsify/4.13.1/docsify.min.js"></script>
    <script src="https://s4.zstatic.net/ajax/libs/docsify/4.13.1/plugins/zoom-image.min.js"></script>
    <script src="https://s4.zstatic.net/ajax/libs/docsify/4.13.1/plugins/emoji.min.js"></script>
    <script src="https://s4.zstatic.net/ajax/libs/docsify-copy-code/3.0.0/docsify-copy-code.min.js"></script>
    <script src="https://s4.zstatic.net/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>
    <script src="https://cdn.cbd.int/docsify-count/dist/countable.js"></script>
    <script src="https://cdn.cbd.int/docsify-scroll-to-top/dist/docsify-scroll-to-top.min.js"></script>
    <script src="https://cdn.cbd.int/docsify-footer-enh/dist/docsify-footer-enh.min.js"></script>
    <script src="https://cdn.cbd.int/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
    <script src="https://cdn.jsdmirror.com/npm/live2d-widget@3.x/lib/L2Dwidget.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
